name: Build agentbox image (GitHub)

# Builds this repo (herdr + herd + Claude Code + tetherd in one image, homelab-gitops
# docs/agentbox.md §Image) and publishes ghcr.io/lordmuffin/agentbox:v<VERSION>, the tag
# the StatefulSet in homelab-gitops pins. It refuses to overwrite a tag that already
# exists, so a change that forgets to bump VERSION fails here instead of silently
# replacing a running image.
#
# Runs on the GitHub mirror of lordmuffin/agentbox (pushed from git.apj.dev). A GitHub
# runner can't reach git.apj.dev (a LAN address), so the Dockerfile clones tether and herd
# from their GitHub copies (SOURCE_BASE). Forgejo never runs this file: it reads
# .forgejo/workflows/ when that exists, and the job is also guarded on github.com.
# .forgejo/workflows/build.yml is dispatch-only, a manual fallback.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   SOURCE_READ_TOKEN  a fine-grained token, Contents: read on lordmuffin/tether and
#                      lordmuffin/herd. Reaches the Dockerfile only as a BuildKit secret.
#   GHCR_TOKEN         optional: a token with write:packages. Without it, GITHUB_TOKEN is
#                      used, which needs the package's "Manage Actions access" to give
#                      this repo the Write role.

on:
  push:
    branches: [main]
    paths-ignore:
      - "tests/**"
      - "**.md"
      - ".forgejo/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-agentbox
  cancel-in-progress: false

jobs:
  build-and-push-github:
    name: Build and push image (GitHub)
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    env:
      IMAGE: ghcr.io/lordmuffin/agentbox
      PUSH_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --quiet 'PyYAML==6.0.3'

      - name: Unit and static tests
        run: python3 -m unittest discover -s tests -t . -v

      - name: Check the source token is set
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$SOURCE_READ_TOKEN" ]; then
            echo "::error::Actions secret SOURCE_READ_TOKEN is missing (Contents: read on lordmuffin/tether and lordmuffin/herd)."
            exit 1
          fi

      - name: Refuse to overwrite an existing tag
        run: |
          token=$(curl -fsS -u "lordmuffin:$PUSH_TOKEN" \
            "https://ghcr.io/token?scope=repository:lordmuffin/agentbox:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/lordmuffin/agentbox/manifests/${{ steps.version.outputs.tag }}")
          case "$code" in
            404) ;;
            200) echo "::error::agentbox:${{ steps.version.outputs.tag }} already exists. Bump VERSION, and the StatefulSet's image tag in homelab-gitops with it."; exit 1 ;;
            *) echo "::error::GHCR answered $code for agentbox:${{ steps.version.outputs.tag }}"; exit 1 ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: lordmuffin
          password: ${{ env.PUSH_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          build-args: |
            SOURCE_BASE=https://github.com/lordmuffin
          secrets: |
            forgejo_read_token=${{ secrets.SOURCE_READ_TOKEN }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Summary
        run: echo "Pushed \`$IMAGE:${{ steps.version.outputs.tag }}@${{ steps.build.outputs.digest }}\`" | tee -a "$GITHUB_STEP_SUMMARY"
