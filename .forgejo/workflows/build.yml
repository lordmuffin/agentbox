name: Build agentbox image

# Builds this repo (herdr + herd + Claude Code + tetherd in one image, homelab-gitops
# docs/agentbox.md §Image) and publishes ghcr.io/lordmuffin/agentbox:v<VERSION>. The
# StatefulSet in homelab-gitops pins that tag. This workflow refuses to overwrite a
# tag that already exists, so a change that forgets to bump VERSION fails here
# instead of silently replacing a running image.
#
# Forgejo only. The image clones the private lordmuffin/tether and lordmuffin/herd
# from git.apj.dev, which resolves even in public DNS to a LAN address
# (192.168.10.20). The read token for those two repos is the SOURCE_READ_TOKEN
# Actions secret and reaches the Dockerfile only as a BuildKit secret, never as a
# build arg. A workflow-only change doesn't build: dispatch it.

# Dispatch only since v0.3.0: GitHub builds the image on a push to main
# (.github/workflows/build.yml, from the GitHub mirror). This stays as a manual
# fallback, and never runs on a push, so the two never race for one tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-agentbox
  cancel-in-progress: false

jobs:
  # Job containers have no Docker socket, so buildctl builds on the in-cluster
  # rootless buildkitd over mutual TLS (homelab-gitops docs/buildkit.md).
  # ubuntu-latest, not self-hosted: buildkitd admits only the k3s2 runner pods, and
  # runner-01 also offers self-hosted.
  build-and-push-buildkit:
    name: Build and push image (buildkitd)
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/lordmuffin/agentbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit and static tests
        run: |
          python3 -m pip install --quiet 'PyYAML==6.0.3'
          python3 -m unittest discover -s tests -t .

      - name: Set up buildctl
        env:
          BUILDKIT_CA: ${{ secrets.BUILDKIT_CA }}
          BUILDKIT_CERT: ${{ secrets.BUILDKIT_CERT }}
          BUILDKIT_KEY: ${{ secrets.BUILDKIT_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          # Same version as homelab-gitops apps/services/buildkit/deployment.yaml.
          # Bump it by hand with the daemon: homelab-gitops' test can't see this job.
          curl -fsSLO https://github.com/moby/buildkit/releases/download/v0.33.1/buildkit-v0.33.1.linux-amd64.tar.gz
          echo "4e044bcd62a0c0bbe6a8c94d73989de2bfe4c04dbc0f9d6021cf96b72cd1d965  buildkit-v0.33.1.linux-amd64.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/tls" "$RUNNER_TEMP/docker"
          tar -xzf buildkit-v0.33.1.linux-amd64.tar.gz -C "$RUNNER_TEMP" bin/buildctl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          for v in BUILDKIT_CA BUILDKIT_CERT BUILDKIT_KEY GHCR_TOKEN SOURCE_READ_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::Actions secret $v is not set"; exit 1; }
          done
          ( umask 077
            printf '%s\n' "$BUILDKIT_CA" > "$RUNNER_TEMP/tls/ca.crt"
            printf '%s\n' "$BUILDKIT_CERT" > "$RUNNER_TEMP/tls/tls.crt"
            printf '%s\n' "$BUILDKIT_KEY" > "$RUNNER_TEMP/tls/tls.key"
            # The Dockerfile reads it from /run/secrets/forgejo_read_token, mounted
            # for the clone RUN only. No trailing newline: it goes in a header.
            printf '%s' "$SOURCE_READ_TOKEN" > "$RUNNER_TEMP/forgejo-read-token"
            # buildctl reads registry credentials client side and hands them to
            # buildkitd per session.
            auth=$(printf 'lordmuffin:%s' "$GHCR_TOKEN" | base64 -w0)
            printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > "$RUNNER_TEMP/docker/config.json" )

      - name: Refuse to overwrite an existing tag
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          token=$(curl -fsS -u "lordmuffin:$GHCR_TOKEN" \
            "https://ghcr.io/token?scope=repository:lordmuffin/agentbox:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/lordmuffin/agentbox/manifests/${{ steps.version.outputs.tag }}")
          case "$code" in
            404) ;;
            200) echo "::error::agentbox:${{ steps.version.outputs.tag }} already exists. Bump VERSION, then the StatefulSet's image tag in homelab-gitops."; exit 1 ;;
            *) echo "::error::GHCR answered $code for agentbox:${{ steps.version.outputs.tag }}"; exit 1 ;;
          esac

      - name: Build and push
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: |
          tls="$RUNNER_TEMP/tls"
          # A brand-new runner pod can be refused for its first second or so,
          # until kube-router admits its IP (homelab-gitops docs/buildkit.md §Clients).
          for i in 1 2 3 4 5; do
            buildctl --addr tcp://buildkitd.buildkit.svc.cluster.local:1234 \
              --tlscacert "$tls/ca.crt" --tlscert "$tls/tls.crt" --tlskey "$tls/tls.key" \
              --tlsservername buildkitd.buildkit.svc.cluster.local \
              debug workers >/dev/null && break
            [ "$i" = 5 ] && exit 1
            sleep 3
          done
          buildctl --addr tcp://buildkitd.buildkit.svc.cluster.local:1234 \
            --tlscacert "$tls/ca.crt" --tlscert "$tls/tls.crt" --tlskey "$tls/tls.key" \
            --tlsservername buildkitd.buildkit.svc.cluster.local \
            build --frontend dockerfile.v0 \
            --local context=. --local dockerfile=. \
            --secret id=forgejo_read_token,src="$RUNNER_TEMP/forgejo-read-token" \
            --opt platform=linux/amd64 \
            --opt label:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --opt label:org.opencontainers.image.revision=${{ github.sha }} \
            --output "type=image,name=$IMAGE:${{ steps.version.outputs.tag }},push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          echo "Pushed \`$IMAGE:${{ steps.version.outputs.tag }}@$digest\`" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove the read token and registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/forgejo-read-token" "$RUNNER_TEMP/docker/config.json" "$RUNNER_TEMP/tls/tls.key"
